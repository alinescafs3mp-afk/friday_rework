[project]
name = "friday-public-baseline"
version = "0.1.0"
description = "Offline-prepared public-core baseline for one Qwen endpoint. Not the Friday product."
requires-python = ">=3.12,<3.13"
dependencies = [
  "evalscope==1.14.1",
  "emoji==2.16.0",
  "nltk==3.10.4",
  "syllapy==0.8.0",
  "langdetect==1.0.9",
  "immutabledict==4.2.2",
]

[tool.friday-public-baseline]
entrypoint = "baseline"
profile = "public-core-v1"
